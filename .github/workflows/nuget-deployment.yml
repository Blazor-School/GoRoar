name: NuGet deploy

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Pack
      run: dotnet pack RoarUI --configuration Release --output .

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet.org
      run: dotnet nuget push "*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

    - name: Push to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push "*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "$env:GITHUB_TOKEN" --skip-duplicate
